id: tbl_person_stateprovince
name: person.stateprovince
source: adventureworks
context: person
kind: domain
identity:
  primary:
  - stateprovinceid
  alternates:
  - columns:
    - stateprovincecode
    - countryregioncode
columns:
  stateprovinceid:
    domain: state_province_id
    status: proposed
    confidence: 0.95
    evidence:
    - PK
    inferred_by: gold-draft
  stateprovincecode:
    domain: state_province_code
    status: proposed
    confidence: 0.85
    evidence:
    - '列コメント: ISO standard'
    inferred_by: gold-draft
  countryregioncode:
    domain: country_region_code
    status: proposed
    confidence: 0.95
    evidence:
    - FK → countryregion
    inferred_by: gold-draft
  isonlystateprovinceflag:
    domain: state_code_availability
    status: proposed
    confidence: 0.8
    evidence:
    - 列コメント
    inferred_by: gold-draft
  name:
    domain: display_name
    status: proposed
    confidence: 0.9
    evidence:
    - 列コメント
    inferred_by: gold-draft
  territoryid:
    domain: sales_territory_id
    status: proposed
    confidence: 0.9
    evidence:
    - FK → salesterritory（正解 OM の範囲外）
    inferred_by: gold-draft
  rowguid:
    domain: row_uuid
    status: proposed
    confidence: 0.95
    evidence:
    - 列名 rowguid
    inferred_by: gold-draft
  modifieddate:
    domain: modified_at
    status: proposed
    confidence: 0.95
    evidence:
    - 列名 modifieddate
    inferred_by: gold-draft
relations:
- id: rel_stateprovince_partof_countryregion
  type: part-of
  target: tbl_person_countryregion
  via:
  - from: countryregioncode
    to: countryregioncode
  cardinality: n:1
  status: proposed
  confidence: 0.9
  evidence:
  - FK 制約
  - 州は国の一部（地理の階層）
  inferred_by: gold-draft
status: proposed
confidence: 0.9
evidence:
- 表コメント
inferred_by: gold-draft
note: 代替キー (stateprovincecode, countryregioncode) は元の AdventureWorks（SQL Server）の一意制約 AK_StateProvince_StateProvinceCode_CountryRegionCode による。 PostgreSQL 版（lorint）には一意制約が無い。データ上は stateprovincecode 単独でも 181 行すべて一意だが、別の国で同じ州コードがありうるので複合のままにした
