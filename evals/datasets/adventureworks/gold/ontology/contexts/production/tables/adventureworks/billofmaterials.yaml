id: tbl_production_billofmaterials
name: production.billofmaterials
source: adventureworks
context: production
kind: relation
grain: 1行 = ある期間に、ある組立品に使われる1つの構成部品（構成の1行）。組立品が NULL の行は最上位の製品そのもの
identity:
  primary:
  - billofmaterialsid
columns:
  billofmaterialsid:
    domain: bill_of_materials_id
    status: proposed
    confidence: 0.95
    evidence:
    - PK
    - '列コメント: Primary key for BillOfMaterials records'
    inferred_by: gold-draft
  productassemblyid:
    domain: product_id
    status: proposed
    confidence: 0.95
    evidence:
    - FK → product
    - '列コメント: Parent product identification number'
    inferred_by: gold-draft
    note: NULL を許す。NULL の 103 行は bomlevel 0 で、最上位の製品を表す（CHECK 制約）
  componentid:
    domain: product_id
    status: proposed
    confidence: 0.95
    evidence:
    - FK → product
    - '列コメント: Component identification number'
    inferred_by: gold-draft
  startdate:
    domain: valid_from
    status: proposed
    confidence: 0.85
    evidence:
    - '列コメント: Date the component started being used in the assembly item'
    inferred_by: gold-draft
  enddate:
    domain: valid_to
    status: proposed
    confidence: 0.85
    evidence:
    - '列コメント: Date the component stopped being used in the assembly item'
    - CHECK enddate > startdate OR enddate IS NULL
    inferred_by: gold-draft
  unitmeasurecode:
    domain: unit_measure_code
    status: proposed
    confidence: 0.9
    evidence:
    - FK → unitmeasure（範囲外）
    - '列コメント: Standard code identifying the unit of measure for the quantity'
    inferred_by: gold-draft
  bomlevel:
    domain: tree_depth
    status: proposed
    confidence: 0.75
    evidence:
    - '列コメント: Indicates the depth the component is from its parent'
    - 値は 0〜4。0 は組立品が NULL の行だけ（CHECK 制約）
    inferred_by: gold-draft
    note: 組立品の木から導ける値を、ソースが持っている
  perassemblyqty:
    domain: component_quantity
    unit:
      column: unitmeasurecode
    status: proposed
    confidence: 0.85
    evidence:
    - '列コメント: Quantity of the component needed to create the assembly'
    - 単位は EA / OZ / IN が混在（別列）
    inferred_by: gold-draft
  modifieddate:
    domain: modified_at
    status: proposed
    confidence: 0.95
    evidence:
    - 列名 modifieddate
    inferred_by: gold-draft
relations:
- id: rel_billofmaterials_assembly
  type: has
  has_kind: reference
  role: assembly
  target: tbl_production_product
  via:
  - from: productassemblyid
    to: productid
  cardinality: n:1
  status: proposed
  confidence: 0.85
  evidence:
  - FK 制約
  - '表コメント: the heirarchical relationship between a parent product and its components'
  inferred_by: gold-draft
  note: NULL を許す。NULL の行（最上位の製品）は辺にならない
- id: rel_billofmaterials_component
  type: has
  has_kind: reference
  role: component
  target: tbl_production_product
  via:
  - from: componentid
    to: productid
  cardinality: n:1
  status: proposed
  confidence: 0.9
  evidence:
  - FK 制約
  inferred_by: gold-draft
edge:
  type: part-of
  from: rel_billofmaterials_component
  to: rel_billofmaterials_assembly
  status: proposed
  confidence: 0.85
  evidence:
  - '表コメント: the heirarchical relationship between a parent product and its components'
  - 組立品 ≠ 部品（CHECK 制約）
  - bomlevel 1〜4 の多段の木
  inferred_by: gold-draft
status: proposed
confidence: 0.9
evidence:
- '表コメント: Items required to make bicycles and bicycle subassemblies'
inferred_by: gold-draft
note: 部品 part-of 組立品（製品同士）の辺を、期間・数量つきの中間表で持つ。（組立品, 部品, 開始日）はデータ上一意（2679 行で重複 0）だが、組立品が NULL を持つので代替キーにしない（仕様 4.2）
