id: tbl_production_product
name: production.product
source: adventureworks
entity_group: production
kind: domain
grain: 1行 = 1製品
identity:
  primary:
  - productid
  alternates:
  - columns:
    - productnumber
  - columns:
    - name
columns:
  productid:
    semantic_type: product_id
    status: proposed
    confidence: 0.95
    evidence:
    - PK
    inferred_by: gold-draft
  name:
    semantic_type: display_name
    status: proposed
    confidence: 0.9
    evidence:
    - 列コメント
    - データ上一意（504 行）。UNIQUE 制約は無い
    inferred_by: gold-draft
  productnumber:
    semantic_type: product_number
    status: proposed
    confidence: 0.9
    evidence:
    - '列コメント: Unique product identification number'
    - データ上一意。UNIQUE 制約は無い
    inferred_by: gold-draft
  makeflag:
    semantic_type: make_flag
    status: proposed
    confidence: 0.9
    evidence:
    - 列コメント
    inferred_by: gold-draft
  finishedgoodsflag:
    semantic_type: salable_flag
    status: proposed
    confidence: 0.9
    evidence:
    - 列コメント
    inferred_by: gold-draft
  color:
    semantic_type: product_color
    status: proposed
    confidence: 0.85
    evidence:
    - 列コメント
    inferred_by: gold-draft
  safetystocklevel:
    semantic_type: stock_threshold
    unit:
      fixed: each
    status: proposed
    confidence: 0.75
    evidence:
    - '列コメント: Minimum inventory quantity'
    inferred_by: gold-draft
  reorderpoint:
    semantic_type: stock_threshold
    unit:
      fixed: each
    status: proposed
    confidence: 0.75
    evidence:
    - 列コメント
    inferred_by: gold-draft
  standardcost:
    semantic_type: standard_cost
    unit:
      fixed: USD
    status: proposed
    confidence: 0.75
    evidence:
    - 列コメント
    - 受注金額と同じ通貨と推定
    inferred_by: gold-draft
  listprice:
    semantic_type: unit_price
    unit:
      fixed: USD
    status: proposed
    confidence: 0.75
    evidence:
    - '列コメント: Selling price'
    inferred_by: gold-draft
  size:
    semantic_type: product_size
    status: proposed
    confidence: 0.7
    evidence:
    - 列コメント
    - 値は S/M/L と数値が混在
    inferred_by: gold-draft
    note: 数値のときの単位は sizeunitmeasurecode。text ドメインなので unit は付けていない。要検討
  sizeunitmeasurecode:
    semantic_type: unit_measure_code
    status: proposed
    confidence: 0.85
    evidence:
    - 列コメント
    - FK → unitmeasure（範囲外）
    inferred_by: gold-draft
  weightunitmeasurecode:
    semantic_type: unit_measure_code
    status: proposed
    confidence: 0.85
    evidence:
    - 列コメント
    - FK → unitmeasure（範囲外）
    inferred_by: gold-draft
  weight:
    semantic_type: product_weight
    unit:
      column: weightunitmeasurecode
    status: proposed
    confidence: 0.85
    evidence:
    - 列コメント
    - 単位は LB と G が混在（別列）
    inferred_by: gold-draft
  daystomanufacture:
    semantic_type: lead_time_days
    unit:
      fixed: day
    status: proposed
    confidence: 0.8
    evidence:
    - 列コメント
    inferred_by: gold-draft
  productline:
    semantic_type: product_line
    status: proposed
    confidence: 0.9
    evidence:
    - 列コメントに値の一覧
    inferred_by: gold-draft
  class:
    semantic_type: product_class
    status: proposed
    confidence: 0.9
    evidence:
    - 列コメントに値の一覧
    inferred_by: gold-draft
  style:
    semantic_type: product_style
    status: proposed
    confidence: 0.9
    evidence:
    - 列コメントに値の一覧
    inferred_by: gold-draft
  productsubcategoryid:
    semantic_type: product_subcategory_id
    status: proposed
    confidence: 0.95
    evidence:
    - FK → productsubcategory
    inferred_by: gold-draft
  productmodelid:
    semantic_type: product_model_id
    status: proposed
    confidence: 0.9
    evidence:
    - FK → productmodel（範囲外）
    inferred_by: gold-draft
  sellstartdate:
    semantic_type: sell_start_date
    status: proposed
    confidence: 0.85
    evidence:
    - 列コメント
    inferred_by: gold-draft
  sellenddate:
    semantic_type: sell_end_date
    status: proposed
    confidence: 0.85
    evidence:
    - 列コメント
    inferred_by: gold-draft
  discontinueddate:
    semantic_type: discontinued_date
    status: proposed
    confidence: 0.85
    evidence:
    - 列コメント
    inferred_by: gold-draft
  rowguid:
    semantic_type: row_uuid
    status: proposed
    confidence: 0.95
    evidence:
    - 列名 rowguid
    inferred_by: gold-draft
  modifieddate:
    semantic_type: modified_at
    status: proposed
    confidence: 0.95
    evidence:
    - 列名 modifieddate
    inferred_by: gold-draft
relations:
- id: rel_product_subcategory
  type: classified-as
  target: tbl_production_productsubcategory
  via:
  - from: productsubcategoryid
    to: productsubcategoryid
  cardinality: n:1
  status: proposed
  confidence: 0.75
  evidence:
  - FK 制約
  - '列コメント: Product is a member of this product subcategory'
  inferred_by: gold-draft
  note: 分類への所属。全体と部分ではない（サブカテゴリは製品を分ける側の階層）ので part-of にしない。is-a（製品はサブカテゴリの一種）でもない。209 行は subcategory が NULL（分類されていない）
status: proposed
confidence: 0.9
evidence:
- 表コメント
inferred_by: gold-draft
