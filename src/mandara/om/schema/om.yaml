id: https://w3id.org/mandara/om
name: mandara_om
title: Mandara OM メタモデル（①）
description: >-
  オントロジカルメタデータ（OM）の形を定義する。仕様 4章、7.6 の①。
  ここに書くのは「注釈とは何か」であり、個々のオントロジーの中身（顧客、注文など）ではない。
  構造的な語彙（表種別、関係型など）は Mandara の意味論に結びつくので enum として持つ。
  拡張できる語彙（列ドメイン、enum の値、表記揺れ）はデータ（vocabulary.yaml）として持つ。
version: 0.1.0
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  om: https://w3id.org/mandara/om/
default_prefix: om
default_range: string
imports:
  - linkml:types

enums:
  ReviewStatus:
    description: 注釈のレビュー状態（4.4）
    permissible_values:
      proposed:
      approved:
      rejected:
  TableKind:
    description: 表種別（4.1）
    permissible_values:
      domain:
        description: ものを表す表。ライフサイクルを持ちうる。コマンド可
      relation:
        description: >-
          もの同士の関係を表す表（n:m 中間表）。属性を持ってよい。コマンド可。
          edge を宣言すると、1行がもの同士を結ぶ1本の辺になり、列はその辺の属性になる
      event:
        description: 出来事を表す表。不変・追記のみ。コマンド不可
      derived:
        description: 計算・集計で導出された表。コマンド不可
  RelationType:
    description: 関係型（4.1）。推移性と逆関係は各値の annotations に持つ
    permissible_values:
      is-a:
        description: 型の階層。下位の型は上位の型の一種で、上位の性質を継承する
        annotations:
          transitive: true
          inverse: has-subtype
      part-of:
        description: 構成階層。全体と部分
        annotations:
          transitive: true
          inverse: has-part
      classified-as:
        description: >-
          分類への所属。ものから分類へ、下位の分類から上位の分類へ（製品 → サブカテゴリ → カテゴリ）。
          全体と部分（part-of）でも、型の一種（is-a）でもない。ドリルダウン階層になる
        annotations:
          transitive: true
          inverse: classifies
      has:
        description: 属性または参照。細分は has_kind で指定
        annotations:
          transitive: false
          inverse: belongs-to
      derived-from:
        description: 導出元。列や表が、どのソースからどの関数で生まれたか
        annotations:
          transitive: true
          inverse: source-of
  HasKind:
    permissible_values:
      attribute:
      reference:
  Cardinality:
    permissible_values:
      "1:1":
      "1:n":
      "n:1":
      "n:m":
  Additivity:
    description: 尺度の加法性（10.4）
    permissible_values:
      additive:
      semi-additive:
      non-additive:
  DomainRole:
    description: 列ドメインの役割
    permissible_values:
      event_time:
      valid_from:
      valid_to:
      technical:
        description: 業務の意味を持たない列（行の技術ID、監査用の日時・更新者）。UI・ツール面・推論から既定で外す
  ValueType:
    description: >-
      列ドメインの値の意味の型。物理的な表現（バイナリ形式、文字コードなど）は含めない。
      物理的な表現は列の encoding に書く。意味の型への変換は encoding ごとのコーデック（Adapters の中で、DB コネクタから独立したもの）の責務とする
    permissible_values:
      identifier:
      code:
        description: 外部の体系に従うコード（国コード、単位コードなど）。値の一覧は持たない
      enum:
        description: 値の一覧（values）を語彙に持つ
      text:
      integer:
      ratio:
      quantity:
        description: 単位を伴う量
      money:
        description: 通貨を単位とする金額
      date:
      datetime:
      geo.point:
        description: 地理上の点（緯度・経度）。UI では地図に出す
      geo.latitude:
      geo.longitude:
      media.image:
      media.audio:
      media.document:
      document.xml:
        description: XML の文書。物理的な表現を名前に含んでいるので見直す（om-backlog M）
  Unit:
    description: 固定の単位（UnitSource.fixed）。足すときは①を変える
    permissible_values:
      USD:
      JPY:
      each:
        description: 個数
      day:
      hour:
  SourceEncoding:
    description: >-
      ソース上の値の物理的な表現が、意味の型（ValueType）の標準的な表現と違うときに書く。
      具体例のあるものだけを置く。各値の annotations の decodes_to は、変換先の ValueType
    permissible_values:
      sqlserver_geography:
        description: SQL Server の geography 型のバイナリ（SRID 4 バイト、版、属性、緯度・経度の float64）
        annotations:
          decodes_to: geo.point
  TypeFamily:
    description: >-
      ソースの列の値の、DB に依存しない型族（カタログ、主張）。
      どれにも当てはまらない組み込みの型は other とし、ソース上の型名で区別する
    permissible_values:
      integer:
      decimal:
      float:
      text:
      boolean:
      date:
      time:
      timestamp:
      binary:
      uuid:
      xml:
      json:
      other:
  ObjectKind:
    description: ソース上のオブジェクトの種類（カタログ、主張）
    permissible_values:
      table:
      view:
      materialized_view:
  ReferentialAction:
    description: 外部キーの参照先の行が消える・変わるときの動作（SQL 標準）。cascade は合成関係の証拠になる
    permissible_values:
      no_action:
      restrict:
      cascade:
      set_null:
      set_default:
  ClaimPredicate:
    description: >-
      主張の述語（6.6.2）。述語ごとに、主語の粒度（表 / 列）と、値として持つフィールドが決まっている。
      今あるのはカタログの抽出器（T1.3）が出すものだけ。足すときは①を変え、検証の形の表も足す
    permissible_values:
      identified_by:
        description: 表は columns で識別される（主キー）
      unique:
        description: 表の columns の組は一意
      references:
        description: 表の columns が、target の target_columns を参照する（外部キー）。on_delete / on_update を持つ
      declared_as:
        description: 表・ビューなどのオブジェクトの種類は object_kind
      not_null:
        description: 列は NULL を持たない
      nullable:
        description: 列は NULL を持ちうる（宣言されている）。宣言の無い列（ビューの列など）には、not_null も nullable も出さない
      defaults_to:
        description: 列の既定値は text の式
      described_as:
        description: 表または列は text で説明されている（コメント）
      checks:
        description: 表の行は text の式を満たす（CHECK）
      typed_as:
        description: 列のソース上の型名は type_name、型族は family、表の中の位置は position
      aliased_as:
        description: 列はユーザー定義の型の別名 type_name を使う
  ClaimSourceKind:
    description: 主張の出所の種類（6.6.2）
    permissible_values:
      schema:
      sql:
      codelist:
      design-doc:
      memo:
      package:
      world:
      review:
  IsARealization:
    description: >-
      論理的な is-a が、ソースでどう実装されているか（C3）。
      具体例のあるものだけを置く。排他的な参照・区分列は AW で裏付けが取れていないので未定義
    permissible_values:
      shared_key:
        description: 下位の表が上位の表と同じ主キーを持ち、それで参照する

slots:
  # --- 注釈の共通フィールド（4.4） ---
  status:
    range: ReviewStatus
    required: true
  confidence:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
  evidence:
    description: 主張台帳（6.6）の主張ID
    multivalued: true
  inferred_by:
    description: 提案者のモデル名と版、実行ID
  reviewed_by:
  reviewed_at:
    range: date
  note:

  name:
    identifier: true
  description:

classes:
  Annotation:
    mixin: true
    description: すべての注釈が持つ共通フィールド（4.4）
    slots:
      - status
      - confidence
      - evidence
      - inferred_by
      - reviewed_by
      - reviewed_at
      - note

  # ---------------------------------------------------------------- 語彙
  Vocabulary:
    tree_root: true
    description: vocabulary.yaml。拡張できる語彙の閉じた集合
    attributes:
      column_domains:
        range: ColumnDomain
        multivalued: true
        inlined: true
        inlined_as_list: false
      aliases:
        range: AliasEntry
        multivalued: true
        inlined: true
        inlined_as_list: false

  ColumnDomain:
    description: 列ドメイン。「同じ意味」を表す
    slots:
      - name
      - description
    attributes:
      type:
        range: ValueType
        required: true
      role:
        range: DomainRole
      additivity:
        range: Additivity
      requires_unit:
        description: true なら、この列ドメインを使う列は unit（量と単位の組、C5）を宣言しなければならない
        range: boolean
      values:
        description: type が enum のときの値の一覧（C6）。値の集合はデータからではなく、宣言・証拠から決める
        range: EnumValue
        multivalued: true
        inlined: true
        inlined_as_list: true

  EnumValue:
    mixins:
      - Annotation
    attributes:
      code:
        description: >-
          ソース上の値の文字列表現。ファイルには文字列で書く（数値の 1 は拒否し、"1" と書く）。
          観測値との照合時の正規化（真偽値の表記など）はソースの Adapter の責務
        required: true
      label:
        required: true
      meaning:
        description: 語彙や公開オントロジーの概念への参照（CURIE）
      observed:
        description: データで観測されたか。値の集合の根拠にはしない
        range: boolean

  AliasEntry:
    slots:
      - name
    attributes:
      terms:
        multivalued: true
        required: true

  # ---------------------------------------------------------------- 表
  Table:
    tree_root: true
    description: contexts/<context>/tables/<source>/<table>.yaml（4.2）
    mixins:
      - Annotation
    attributes:
      id:
        identifier: true
        description: 安定ID。改名しても変わらない
        pattern: "^tbl_[0-9A-Za-z_]+$"
      name:
        description: ソース上の名前（schema.table）
        required: true
      source:
        required: true
      context:
        required: true
      kind:
        range: TableKind
        required: true
      grain:
        description: 1行が何を表すか（10.4）
      identity:
        range: Identity
        inlined: true
      columns:
        range: Column
        multivalued: true
        inlined: true
        inlined_as_list: false
      relations:
        range: Relation
        multivalued: true
        inlined: true
        inlined_as_list: true
      edge:
        description: relation の表だけが持てる。この表の行が実現する、もの同士の関係
        range: Edge
        inlined: true

  Edge:
    description: >-
      中間表の1行を、もの同士を結ぶ1本の辺とみなす（プロパティグラフの辺）。
      from と to は、この表が持つ n:1 の参照（has / reference）の ID。
      辺の関係型の意味論（推移性、循環の禁止、ドリルダウン）は、表の間の関係と同じに効く。
      from / to の列が NULL の行は辺にならない。type が has の辺は参照（reference）を表す
    mixins:
      - Annotation
    attributes:
      type:
        description: has / part-of / classified-as のどれか。is-a は型の間の関係、derived-from は関数による導出なので、辺にはならない
        range: RelationType
        required: true
      from:
        description: 辺の始点側の参照の ID（part-of なら部分、classified-as なら分類されるもの）
        required: true
      to:
        description: 辺の終点側の参照の ID（part-of なら全体、classified-as なら分類）
        required: true

  Identity:
    description: >-
      同一性（C1）。複合キーは列の配列としてそのまま書く。1つの値として扱うのは生成される型の側の責務
    attributes:
      primary:
        multivalued: true
        required: true
        minimum_cardinality: 1
      alternates:
        range: KeyColumns
        multivalued: true
        inlined: true
        inlined_as_list: true

  KeyColumns:
    attributes:
      columns:
        multivalued: true
        required: true
        minimum_cardinality: 1

  Column:
    mixins:
      - Annotation
    slots:
      - name
    attributes:
      domain:
        description: vocabulary の column_domains のキー
      pii:
        range: boolean
      unit:
        description: 量の単位の出所（C5）。fixed / column のちょうど1つ
        range: UnitSource
        inlined: true
      encoding:
        description: ソース上の値の物理的な表現。意味の型の標準的な表現と同じなら書かない
        range: SourceEncoding

  UnitSource:
    attributes:
      fixed:
        description: 固定の単位
        range: Unit
      column:
        description: 同じ表で単位を持つ列

  # ---------------------------------------------------------------- 関係
  Relation:
    mixins:
      - Annotation
    attributes:
      id:
        description: 関係の安定ID。同じ表への複数の参照（C2）を区別する
        required: true
        pattern: "^rel_[0-9A-Za-z_]+$"
      type:
        range: RelationType
        required: true
      has_kind:
        range: HasKind
      role:
        description: 参照の役割（C2。例 bill_to / ship_to）
      target:
        description: 参照先の表の安定ID。自己参照は self と書き、自分の安定ID は書かない
        required: true
      via:
        description: 結合に使う列の対応。複合キーなら複数
        range: ColumnPair
        multivalued: true
        inlined: true
        inlined_as_list: true
      via_function:
        description: 列の等値で結べない関係（C4。パス文字列の木など）を結ぶ決定的関数の安定ID
      cardinality:
        range: Cardinality
      realized_by:
        description: is-a の物理的な実装パターン（C3）
        range: IsARealization
      columns:
        description: derived-from で導出される列
        multivalued: true
      function:
        description: derived-from の変換関数の安定ID

  ColumnPair:
    attributes:
      from:
        required: true
      to:
        required: true

  # ---------------------------------------------------------------- 主張台帳（6.6）
  ClaimFile:
    tree_root: true
    description: >-
      work/<source>/claims/<schema>/<table>.yaml。その表を主語とする主張（列を主語とするものを含む）の一覧。
      決定的な抽出器の主張は再生成できるキャッシュで、git に乗せない
    attributes:
      claims:
        range: Claim
        multivalued: true
        inlined: true
        inlined_as_list: true

  Claim:
    description: >-
      ソースについての主張。id は内容（subject、predicate、値のフィールド、source）から決まり、
      抽出器の版・確信度・実行時刻には依存しない。再生成しても同じ id になる
    attributes:
      id:
        required: true
        pattern: "^clm_[0-9a-f]{16}$"
      subject:
        range: SourceRef
        required: true
        inlined: true
      predicate:
        range: ClaimPredicate
        required: true
      columns:
        multivalued: true
      target:
        range: SourceRef
        inlined: true
      target_columns:
        multivalued: true
      on_delete:
        range: ReferentialAction
      on_update:
        range: ReferentialAction
      text:
      type_name:
      family:
        range: TypeFamily
      position:
        description: 列の、表の中の位置（1 から）
        range: integer
        minimum_value: 1
      object_kind:
        range: ObjectKind
      source:
        range: ClaimSource
        required: true
        inlined: true
      extracted_by:
        description: 抽出器の名前と版
        required: true
      valid_at:
        description: 出所の日付（文書の日付など）。鮮度の根拠
        range: date
      confidence:
        range: float
        required: true
        minimum_value: 0.0
        maximum_value: 1.0

  SourceRef:
    description: データソース上の表または列。OM の安定 ID ができる前の段階なので、ソース上の名前で指す
    attributes:
      source:
        required: true
      schema_name:
        description: スキーマ名（schema は pydantic の BaseModel と衝突するので避ける）
        required: true
      table:
        required: true
      column:

  ClaimSource:
    attributes:
      kind:
        range: ClaimSourceKind
        required: true
      locator:
        description: 出所の中の場所（制約名、ファイルと行など）
        required: true
