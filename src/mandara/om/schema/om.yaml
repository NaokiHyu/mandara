id: https://w3id.org/mandara/om
name: mandara_om
title: Mandara OM メタモデル（①）
description: >-
  オントロジカルメタデータ（OM）の形を定義する。仕様 4章、7.6 の①。
  ここに書くのは「注釈とは何か」であり、個々のオントロジーの中身（顧客、注文など）ではない。
  構造的な語彙（表種別、関係型など）は Mandara の意味論に結びつくので enum として持つ。
  拡張できる語彙（意味型、enum の値、表記揺れ）はデータ（vocabulary.yaml）として持つ。
version: 0.1.0
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  om: https://w3id.org/mandara/om/
default_prefix: om
default_range: string
imports:
  - linkml:types

enums:
  PrimerOrigin:
    description: 手引きの項目の出所
    permissible_values:
      document:
        description: 置いた文書に書いてある（引用が文書にある）
      general:
        description: 業界の一般知識（ライターの LLM が補った。文書には無い）
  ReviewStatus:
    description: 注釈のレビュー状態（4.4）
    permissible_values:
      proposed:
      approved:
      rejected:
  TableKind:
    description: 表種別（4.1）
    permissible_values:
      domain:
        description: ものを表す表。ライフサイクルを持ちうる。コマンド可
      relation:
        description: >-
          もの同士の関係を表す表（n:m 中間表）。属性を持ってよい。コマンド可。
          edge を宣言すると、1行がもの同士を結ぶ1本の辺になり、列はその辺の属性になる
      event:
        description: 出来事を表す表。不変・追記のみ。コマンド不可
  RelationType:
    description: 関係型（4.1）。推移性と逆関係は各値の annotations に持つ
    permissible_values:
      is-a:
        description: 型の階層。下位の型は上位の型の一種で、上位の性質を継承する
        annotations:
          transitive: true
          inverse: has-subtype
      part-of:
        description: 構成階層。全体と部分
        annotations:
          transitive: true
          inverse: has-part
      classified-as:
        description: >-
          分類への所属。ものから分類へ、下位の分類から上位の分類へ（製品 → サブカテゴリ → カテゴリ）。
          全体と部分（part-of）でも、型の一種（is-a）でもない。ドリルダウン階層になる
        annotations:
          transitive: true
          inverse: classifies
      has:
        description: 属性または参照。細分は has_kind で指定
        annotations:
          transitive: false
          inverse: belongs-to
      derived-from:
        description: 導出元。列や表が、どのソースからどの関数で生まれたか
        annotations:
          transitive: true
          inverse: source-of
  HasKind:
    permissible_values:
      attribute:
      reference:
  Cardinality:
    permissible_values:
      "1:1":
      "1:n":
      "n:1":
      "n:m":
  Additivity:
    description: 尺度の加法性（10.4）
    permissible_values:
      additive:
      semi-additive:
      non-additive:
  SemanticRole:
    description: 意味型の役割
    permissible_values:
      event_time:
      valid_from:
      valid_to:
      technical:
        description: 業務の意味を持たない列（行の技術ID、監査用の日時・更新者）。UI・ツール面・推論から既定で外す
  ValueType:
    description: >-
      意味型の値の型。物理的な表現（バイナリ形式、文字コードなど）は含めない。
      物理的な表現は列の encoding に書く。意味の型への変換は encoding ごとのコーデック（I/O の無い純粋な変換。DB コネクタから独立したもの）の責務とする
    permissible_values:
      identifier:
      code:
        description: 外部の体系に従うコード（国コード、単位コードなど）。値の一覧は持たない
      enum:
        description: 値の一覧（values）を語彙に持つ
      text:
      integer:
      ratio:
      quantity:
        description: 単位を伴う量
      money:
        description: 通貨を単位とする金額
      date:
      datetime:
      geo.point:
        description: 地理上の点（緯度・経度）。UI では地図に出す
      geo.latitude:
      geo.longitude:
      media.image:
      media.audio:
      media.document:
      document.xml:
        description: XML の文書。物理的な表現を名前に含んでいるので見直す（om-backlog M）
  Unit:
    description: 固定の単位（UnitSource.fixed）。足すときは①を変える
    permissible_values:
      USD:
      JPY:
      each:
        description: 個数
      day:
      hour:
  SourceEncoding:
    description: >-
      ソース上の値の物理的な表現が、意味の型（ValueType）の標準的な表現と違うときに書く。
      具体例のあるものだけを置く。各値の annotations の decodes_to は、変換先の ValueType
    permissible_values:
      sqlserver_geography:
        description: SQL Server の geography 型のバイナリ（SRID 4 バイト、版、属性、緯度・経度の float64）
        annotations:
          decodes_to: geo.point
  TypeFamily:
    description: >-
      ソースの列の値の、DB に依存しない型族（カタログ、主張）。
      どれにも当てはまらない組み込みの型は other とし、ソース上の型名で区別する
    permissible_values:
      integer:
      decimal:
      float:
      text:
      boolean:
      date:
      time:
      timestamp:
      binary:
      uuid:
      xml:
      json:
      other:
  ObjectKind:
    description: ソース上のオブジェクトの種類（カタログ、主張）
    permissible_values:
      table:
      view:
      materialized_view:
  ReferentialAction:
    description: 外部キーの参照先の行が消える・変わるときの動作（SQL 標準）。cascade は合成関係の証拠になる
    permissible_values:
      no_action:
      restrict:
      cascade:
      set_null:
      set_default:
  ClaimPredicate:
    description: >-
      主張の述語（6.6.2）。述語ごとに、主語の粒度（表 / 列）と、値として持つフィールドが決まっている。
      カタログの抽出器（T1.3）と、実データの値の抽出器（T2.4、参照の被覆）が出す。足すときは①を変え、検証の形の表も足す
    permissible_values:
      identified_by:
        description: 表は columns で識別される（主キー）
      unique:
        description: 表の columns の組は一意
      references:
        description: 表の columns が、target の target_columns を参照する（外部キー）。on_delete / on_update を持つ
      declared_as:
        description: 表・ビューなどのオブジェクトの種類は object_kind
      not_null:
        description: 列は NULL を持たない
      nullable:
        description: 列は NULL を持ちうる（宣言されている）。宣言の無い列（ビューの列など）には、not_null も nullable も出さない
      defaults_to:
        description: 列の既定値は text の式
      described_as:
        description: 表または列は text で説明されている（コメント）
      checks:
        description: 表の行は text の式を満たす（CHECK）
      typed_as:
        description: 列のソース上の型名は type_name、型族は family、表の中の位置は position
      aliased_as:
        description: 列はユーザー定義の型の別名 type_name を使う
      encoded_as:
        description: 列の値は物理的な表現 encoding で書かれている（実データの値の抽出器 T2.4 が出す。読んだ値がすべてそのコーデックで読めた）
      amounts_in:
        description: >-
          表の金額は、行が別の単位を言わない限り fixed_unit（人が宣言したソースの性質。宣言のファイルから抽出のたびに作る）
      covers_all:
        description: >-
          表の columns で target の target_columns を参照する行が、target のすべての行にある（実データ。target が空なら出さない）
      discriminated_by:
        description: >-
          表の columns で target の target_columns を参照される target の行は、ちょうど target の列 discriminator が
          discriminator_values のどれかである行（実データ。区分の列。値の一部だけが参照され、残りは参照されない）
      included_in:
        description: >-
          表の columns（NULL を除く）の値を数えた結果：異なる値が distinct_values 個、そのうち target の target_columns
          （キー）にあるのが matched_values 個。target のキーの値は target_values 個。1 つの値の行は最大 max_repeats 行。
          整数の列なら、列の値の最小から最大までの整数の数 value_span と、その範囲にあるキーの値の数 target_values_in_span
          （整数でない列、値の無い列では持たない）。
          実データの測定で、宣言の無い参照（外部キー）の候補の事実。包含が成り立たない組も、否定の証拠として残す（仕様 6.7.2 B / D）
      unique_in_data:
        description: >-
          表の columns の値の組が、実データで重複せず NULL も無い（行が distinct_values 行。T2.7）。組は極小（真部分集合は
          一意でない）。宣言の unique とは別：測った時点の事実で、制約ではない
      shaped_as:
        description: >-
          列の値の形（実データ。T2.6）：NULL を除いた異なる値 distinct_values 個のうち sampled_values 個の見本を、構文パターンに
          一般化した上位の patterns と、それぞれに当たる見本の割合 pattern_shares。shape_level は MDL で選んだ一般化の段
          （1 = 文字の種類と長さ、2 = 文字の種類、3 = 文字の種類の集合）。
          値の文字列は入れない（共通の接頭辞のような定数も）
      resembles:
        description: >-
          表の columns と target の target_columns の値の似かた（実データ。T2.6）：信号 method（名前と版）で測った値 score と、
          同じ母集団ならこのくらいという基準 baseline。見本の数は sampled_values と target_sampled_values。
          読み方（近いと言えるか）は信号ごとに決まる（mandara.resemblance.signals）。組の向きは名前の順で 1 つ
  GroupView:
    description: >-
      近隣の集まりの見せ方。OM（種類、意味型の役割と加法性）と件数から機械的に決める（browse.group_view）
    permissible_values:
      list:
        description: 個々のサマリを並べる（件数が少ない）
      summary:
        description: 件数、尺度の集計、enum の内訳、新しい（または先頭の）数件
      time_series:
        description: 時系列の線グラフ（出来事の時刻の列があり、件数が多い）
      timeline:
        description: 期間の帯（valid_from と valid_to の列を持つ）
  MeasureOp:
    description: >-
      尺度の集計のしかた（加法性から決まる。additive は sum、non-additive は avg。semi-additive は集まり全体では集計しない
      （時間の軸が無いと OM から言えないため）。最新の時点の行だけで合計する（LatestDay.snapshot））
    permissible_values:
      sum:
      avg:
  BucketUnit:
    description: 時系列の区切り（期間の幅から決まる）
    permissible_values:
      day:
      month:
      year:
  LabelSource:
    description: インスタンスの見出しの出どころ
    permissible_values:
      own:
        description: その表の見出しの列
      borrowed:
        description: is-a の上位（主キーを共有する）の同じキーの行の見出し
      borrowed_missing:
        description: 上位から借りるはずが、上位に同じキーの行が無い（壊れた参照）。見出しはキー
      key:
        description: 見出しの列も借りる先も無いので、キー
  ClaimSourceKind:
    description: 主張の出所の種類（6.6.2）
    permissible_values:
      schema:
      sql:
      codelist:
      data:
        description: ソースの実データの値（列の値を読んだもの）
      declaration:
        description: 人が宣言したソースの性質（work/<source>/declarations.yaml。抽出のたびに主張に作り直す）
      design-doc:
      memo:
      package:
      world:
      review:
  OntologySourceKind:
    description: 見られる OM の出どころ
    permissible_values:
      work:
        description: 提案した OM（work/<source>/ontology）
      gold:
        description: 正解 OM
  LinkState:
    description: 参照先（n:1）へのリンクの状態（ドメインビューワ）
    permissible_values:
      found:
        description: 参照先の行がある
      "null":
        description: 参照の列が NULL（参照していない）
      missing:
        description: 参照の列に値があるのに、参照先の行が無い（壊れた参照）
  RelatedKind:
    description: インスタンスの近隣の集まりの種類（ドメインビューワ）
    permissible_values:
      children:
        description: 他のドメインの行がこのインスタンスを参照している（1:n。受注 → 明細）
      via:
        description: relation の表を挟んだ先のインスタンス（n:m。製品 ⇄ 仕入先）。relation の表そのものは出さない
  ReviewSubject:
    description: レビューの問いが判断するもの（注釈を持つクラス）
    permissible_values:
      table:
      relation:
      edge:
      column:
      enum_value:
  ReviewDecision:
    description: レビューの答え（仕様 9.3）。「別の意味」は T3.6
    permissible_values:
      approve:
      reject:
  IsARealization:
    description: >-
      論理的な is-a が、ソースでどう実装されているか（C3）。
      具体例のあるものだけを置く。排他的な参照・区分列は AW で裏付けが取れていないので未定義
    permissible_values:
      shared_key:
        description: 下位の表が上位の表と同じ主キーを持ち、それで参照する

slots:
  # --- 注釈の共通フィールド（4.4） ---
  status:
    range: ReviewStatus
    required: true
  confidence:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
  evidence:
    description: 主張台帳（6.6）の主張ID
    multivalued: true
  inferred_by:
    description: 提案者のモデル名と版、実行ID
  reviewed_by:
  reviewed_at:
    range: date
  note:

  name:
    identifier: true
  description:

classes:
  Annotation:
    mixin: true
    description: すべての注釈が持つ共通フィールド（4.4）
    slots:
      - status
      - confidence
      - evidence
      - inferred_by
      - reviewed_by
      - reviewed_at
      - note

  # ---------------------------------------------------------------- 語彙
  Vocabulary:
    tree_root: true
    description: vocabulary.yaml。拡張できる語彙の閉じた集合
    attributes:
      semantic_types:
        range: SemanticType
        multivalued: true
        inlined: true
        inlined_as_list: false
      aliases:
        range: AliasEntry
        multivalued: true
        inlined: true
        inlined_as_list: false

  SemanticType:
    description: >-
      意味型。列の値が何を意味するか（住所の ID、受注日、金額）。別の表の列でも、意味が同じなら同じ意味型にする。
      同じ値の型でも意味が違えば別の意味型にする（受注日と出荷日）
    slots:
      - name
      - description
    attributes:
      type:
        range: ValueType
        required: true
      role:
        range: SemanticRole
      additivity:
        range: Additivity
      requires_unit:
        description: true なら、この意味型を使う列は unit（量と単位の組、C5）を宣言しなければならない
        range: boolean
      values:
        description: type が enum のときの値の一覧（C6）。値の集合はデータからではなく、宣言・証拠から決める
        range: EnumValue
        multivalued: true
        inlined: true
        inlined_as_list: true

  EnumValue:
    mixins:
      - Annotation
    attributes:
      code:
        description: >-
          ソース上の値の文字列表現。ファイルには文字列で書く（数値の 1 は拒否し、"1" と書く）。
          観測値との照合時の正規化（真偽値の表記など）はソースの Adapter の責務
        required: true
      label:
        required: true
      meaning:
        description: 語彙や公開オントロジーの概念への参照（CURIE）
      observed:
        description: データで観測されたか。値の集合の根拠にはしない
        range: boolean

  AliasEntry:
    slots:
      - name
    attributes:
      terms:
        multivalued: true
        required: true

  # ---------------------------------------------------------------- 表
  Table:
    tree_root: true
    description: entity_groups/<entity_group>/tables/<source>/<table>.yaml（4.2）
    mixins:
      - Annotation
    attributes:
      id:
        identifier: true
        description: 安定ID。改名しても変わらない
        pattern: "^tbl_[0-9A-Za-z_]+$"
      name:
        description: ソース上の名前（schema.table）
        required: true
      source:
        required: true
      entity_group:
        description: >-
          エンティティグループ：ドメインの意味的な集まり（仕様の用語集と 4.2）。境界づけられたコンテキストではない（それはスキーマコンテキスト。4.3）
        required: true
      kind:
        description: >-
          表種別。提案の段階では未決（無い）でもよい（規則や証拠で決まらないものを既定値で埋めない）。
          approved の表には必須
        range: TableKind
      derived:
        description: >-
          計算・集計で導出された表（ビューなど）。kind（何を表すか）とは別の軸で、どの kind とも組み合わさる。
          コマンド不可。part-of の全体側にならない。ソースが実体の表なら書かない
        range: boolean
      grain:
        description: 1行が何を表すか（10.4）
      identity:
        range: Identity
        inlined: true
      columns:
        range: Column
        multivalued: true
        inlined: true
        inlined_as_list: false
      relations:
        range: Relation
        multivalued: true
        inlined: true
        inlined_as_list: true
      edge:
        description: relation の表だけが持てる。この表の行が実現する、もの同士の関係
        range: Edge
        inlined: true

  Edge:
    description: >-
      中間表の1行を、もの同士を結ぶ1本の辺とみなす（プロパティグラフの辺）。
      from と to は、この表が持つ n:1 の参照（has / reference）の ID。
      辺の関係型の意味論（推移性、循環の禁止、ドリルダウン）は、表の間の関係と同じに効く。
      from / to の列が NULL の行は辺にならない。type が has の辺は参照（reference）を表す
    mixins:
      - Annotation
    attributes:
      type:
        description: has / part-of / classified-as のどれか。is-a は型の間の関係、derived-from は関数による導出なので、辺にはならない
        range: RelationType
        required: true
      from:
        description: 辺の始点側の参照の ID（part-of なら部分、classified-as なら分類されるもの）
        required: true
      to:
        description: 辺の終点側の参照の ID（part-of なら全体、classified-as なら分類）
        required: true

  Identity:
    description: >-
      同一性（C1）。複合キーは列の配列としてそのまま書く。1つの値として扱うのは生成される型の側の責務
    attributes:
      primary:
        multivalued: true
        required: true
        minimum_cardinality: 1
      alternates:
        range: KeyColumns
        multivalued: true
        inlined: true
        inlined_as_list: true

  KeyColumns:
    attributes:
      columns:
        multivalued: true
        required: true
        minimum_cardinality: 1

  Column:
    mixins:
      - Annotation
    slots:
      - name
    attributes:
      semantic_type:
        description: vocabulary の semantic_types のキー
      pii:
        range: boolean
      unit:
        description: 量の単位の出所（C5）。fixed / column のちょうど1つ
        range: UnitSource
        inlined: true
      encoding:
        description: ソース上の値の物理的な表現。意味の型の標準的な表現と同じなら書かない
        range: SourceEncoding

  UnitSource:
    attributes:
      fixed:
        description: 固定の単位
        range: Unit
      column:
        description: 同じ表で単位を持つ列

  # ---------------------------------------------------------------- 関係
  Relation:
    mixins:
      - Annotation
    attributes:
      id:
        description: 関係の安定ID。同じ表への複数の参照（C2）を区別する
        required: true
        pattern: "^rel_[0-9A-Za-z_]+$"
      type:
        range: RelationType
        required: true
      has_kind:
        range: HasKind
      role:
        description: 参照の役割（C2。例 bill_to / ship_to）
      target:
        description: 参照先の表の安定ID。自己参照は self と書き、自分の安定ID は書かない
        required: true
      via:
        description: 結合に使う列の対応。複合キーなら複数
        range: ColumnPair
        multivalued: true
        inlined: true
        inlined_as_list: true
      via_function:
        description: 列の等値で結べない関係（C4。パス文字列の木など）を結ぶ決定的関数の安定ID
      cardinality:
        range: Cardinality
      realized_by:
        description: is-a の物理的な実装パターン（C3）
        range: IsARealization
      columns:
        description: derived-from で導出される列
        multivalued: true
      function:
        description: derived-from の変換関数の安定ID

  ColumnPair:
    attributes:
      from:
        required: true
      to:
        required: true

  # ---------------------------------------------------------------- 主張台帳（6.6）
  ClaimFile:
    tree_root: true
    description: >-
      work/<source>/claims/<schema>/<table>.yaml。その表を主語とする主張（列を主語とするものを含む）の一覧。
      決定的な抽出器の主張は再生成できるキャッシュで、git に乗せない
    attributes:
      claims:
        range: Claim
        multivalued: true
        inlined: true
        inlined_as_list: true

  Claim:
    description: >-
      ソースについての主張。id は内容（subject、predicate、値のフィールド、source）から決まり、
      抽出器の版・確信度・実行時刻には依存しない。再生成しても同じ id になる
    attributes:
      id:
        required: true
        pattern: "^clm_[0-9a-f]{16}$"
      subject:
        range: SourceRef
        required: true
        inlined: true
      predicate:
        range: ClaimPredicate
        required: true
      columns:
        multivalued: true
      target:
        range: SourceRef
        inlined: true
      target_columns:
        multivalued: true
      on_delete:
        range: ReferentialAction
      on_update:
        range: ReferentialAction
      text:
      type_name:
      family:
        range: TypeFamily
      position:
        description: 列の、表の中の位置（1 から）
        range: integer
        minimum_value: 1
      object_kind:
        range: ObjectKind
      encoding:
        range: SourceEncoding
      fixed_unit:
        description: 固定の単位（amounts_in）
        range: Unit
      discriminator:
        description: 区分の列の名前（target の列）
      discriminator_values:
        description: 区分の列の値（ソースの値の文字列表現。NULL は含めない）
        multivalued: true
      distinct_values:
        description: included_in：表の columns の、NULL を除いた異なる値の数
        range: integer
        minimum_value: 0
      matched_values:
        description: included_in：そのうち target の target_columns にある値の数
        range: integer
        minimum_value: 0
      target_values:
        description: included_in：target の target_columns（キー）の値の数
        range: integer
        minimum_value: 0
      max_repeats:
        description: included_in：表の columns の1つの値を持つ行の最大の数（1 なら値は重ならない。1:1 の手がかり）
        range: integer
        minimum_value: 0
      value_span:
        description: >-
          included_in：整数の列だけ。表の columns の値の最小から最大までにある整数の数（最大 − 最小 + 1）
        range: integer
        minimum_value: 1
      target_values_in_span:
        description: >-
          included_in：整数の列だけ。target の target_columns（キー）の値のうち、表の columns の値の最小から最大までにある数。
          value_span と比べると、列の値の範囲でのキーの詰まり方が分かる（隙間の多い範囲で全部含まれるなら、偶然ではない）
        range: integer
        minimum_value: 0
      patterns:
        description: shaped_as：構文パターン（多い順）
        multivalued: true
      pattern_shares:
        description: shaped_as：patterns の順に、そのパターンに当たる見本の割合（0〜1）
        range: float
        multivalued: true
      shape_level:
        description: shaped_as：MDL で選んだ一般化の段（1〜3）
        range: integer
        minimum_value: 1
        maximum_value: 3
      sampled_values:
        description: shaped_as / resembles：表の columns の値の見本の数（異なる値）
        range: integer
        minimum_value: 0
      target_sampled_values:
        description: resembles：target の target_columns の値の見本の数（異なる値）
        range: integer
        minimum_value: 0
      method:
        description: resembles：信号の名前と版（"ncd 0.1" など）
      score:
        description: resembles：信号の測った値
        range: float
      baseline:
        description: resembles：同じ母集団ならこのくらい、という基準の値（信号ごとに意味が決まる）
        range: float
      source:
        range: ClaimSource
        required: true
        inlined: true
      extracted_by:
        description: 抽出器の名前と版
        required: true
      valid_at:
        description: 出所の日付（文書の日付など）。鮮度の根拠
        range: date
      confidence:
        range: float
        required: true
        minimum_value: 0.0
        maximum_value: 1.0

  SourceDeclarations:
    tree_root: true
    description: >-
      人が宣言するソースの性質（work/<source>/declarations.yaml）。データやカタログからは分からないことだけを書く。
      抽出のたびに主張（source.kind: declaration）にし、推論の根拠にする
    attributes:
      default_currency:
        description: ソースの金額の通貨（行が別の単位を言わない限り）
        range: Unit

  Primer:
    tree_root: true
    description: >-
      業界の手引き（ライターが、スキーマコンテキストに置いた文書とカタログの全体像から書く。<docs>/primer.yaml）。
      人が読んで直してよく、あればそれを正とする（作り直すときは消す）。コーディネーターが表ごとの背景を組み立てる材料
    attributes:
      written_by:
        description: 書いたライターと LLM（例 "writer 0.1 (claude-haiku-5-5)"）
        required: true
      documents:
        description: 書いたときに読んだ文書（名前の順）
        range: PrimerDocument
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      summary:
        description: 世界の要約（業種、業務の流れ、規模）
        required: true
      entity_groups:
        range: PrimerGroup
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      entries:
        range: PrimerEntry
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true

  PrimerDocument:
    attributes:
      name:
        description: 文書の置き場所からの相対パス
        required: true
      sha256:
        required: true

  PrimerGroup:
    description: エンティティグループ（既定はスキーマ名）のひと言
    attributes:
      name:
        required: true
      description:
        required: true

  PrimerEntry:
    description: 用語集の項目。関わる表（schema.table）を付ける（コーディネーターが表ごとに選ぶ手がかり）
    attributes:
      term:
        required: true
      meaning:
        required: true
      tables:
        multivalued: true
        required: true
      origin:
        range: PrimerOrigin
        required: true
      quote:
        description: origin が document のとき、根拠の文書の原文（文書に実在すること）

  SourceRef:
    description: データソース上の表または列。OM の安定 ID ができる前の段階なので、ソース上の名前で指す
    attributes:
      source:
        required: true
      schema_name:
        description: スキーマ名（schema は pydantic の BaseModel と衝突するので避ける）
        required: true
      table:
        required: true
      column:

  ClaimSource:
    attributes:
      kind:
        range: ClaimSourceKind
        required: true
      locator:
        description: 出所の中の場所（制約名、ファイルと行など）
        required: true

  # ---------------------------------------------------------------- プロセス境界の契約
  OntologyIndex:
    tree_root: true
    description: 見られる OM の一覧。プロセス境界（HTTP API → UI）で受け渡す形
    attributes:
      ontologies:
        range: OntologyListing
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true

  OntologyListing:
    attributes:
      id:
        description: URL に使う ID（例 work:adventureworks、gold:adventureworks）
        required: true
      label:
        required: true
      kind:
        range: OntologySourceKind
        required: true
      reviewable:
        description: レビューの問いの列を読めるか（レビューするのは作業領域の OM だけ。正解 OM などは false）
        range: boolean
        required: true

  OntologyDocument:
    tree_root: true
    description: >-
      OM 全体を1つの文書にしたもの。プロセス境界（HTTP API → UI）で受け渡す形。
      ファイルの配置（仕様 5章）とは別。受け取る側は、①から生成した JSON Schema で検証する
    attributes:
      vocabulary:
        range: Vocabulary
        required: true
        inlined: true
      tables:
        range: Table
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true

  ReviewQueue:
    tree_root: true
    description: >-
      レビューの問いの列（仕様 9.3）。並びは影響の大きい順。プロセス境界（HTTP API → UI）で受け渡す形
    attributes:
      ontology:
        description: 見られる OM の ID
        required: true
      pending:
        description: まだ判断されていない提案の数（= questions の数）
        range: integer
        required: true
        minimum_value: 0
      questions:
        range: ReviewQuestion
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      writable:
        description: この API で答えを書けるか
        range: boolean
        required: true
      not_writable_reason:
        description: 書けないときの理由（writable が false のときだけ）
      reviewer:
        description: 書くときの reviewed_by（writable のときだけ）
      bulk_minimum:
        description: 一括承認の閾値の下限
        range: float
        required: true
      approve_all:
        description: >-
          開発用の全承認が使えるか（mandara serve --dev）。中身を見ずに固定するので、開発中に承認済みの状態を試すためだけに使う
        range: boolean
        required: true

  ReviewQuestion:
    attributes:
      location:
        description: 答えを当てる注釈の場所（Ontology.annotations() の場所）
        required: true
      table:
        description: 問いの属する表の安定 ID（語彙の enum の値の問いには無い）
      subject:
        range: ReviewSubject
        required: true
      text:
        required: true
      confidence:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
      evidence:
        description: 根拠（仕様 9.3：3行まで）
        range: EvidenceLine
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      evidence_total:
        description: 根拠の主張の数（evidence に出さなかったものを含む）
        range: integer
        required: true
        minimum_value: 0
      needs_kind:
        description: 承認するには表の種類を選ぶ
        range: boolean
        required: true
      bulk_candidate:
        description: 一括承認の候補（確信度が bulk_minimum 以上で、種類を選ばなくてよい）
        range: boolean
        required: true

  EvidenceLine:
    attributes:
      id:
        description: 主張 ID
        required: true
      text:
        description: 人が読める1行
        required: true

  ReviewAnswer:
    tree_root: true
    description: 1つの問いへの答え。プロセス境界（UI → HTTP API）で受け渡す形
    attributes:
      location:
        required: true
      decision:
        range: ReviewDecision
        required: true
      kind:
        description: 種類が未決の表を承認するときに選んだ種類
        range: TableKind

  BulkApproval:
    tree_root: true
    description: 一覧で見せた候補の一括承認（仕様 9.3）。プロセス境界（UI → HTTP API）で受け渡す形
    attributes:
      threshold:
        range: float
        required: true
      locations:
        description: 見せた候補の場所。今も候補のままであることを確かめてから承認する
        multivalued: true
        required: true

  AllApproval:
    tree_root: true
    description: >-
      開発用の全承認（mandara serve --dev のときだけ）。種類を選ぶ問いを除く、まだ判断されていない問いをすべて承認する。
      プロセス境界（UI → HTTP API）で受け渡す形
    attributes:
      locations:
        description: 見せた問いの場所。今も種類を選ばなくてよい未判断の問いのままであることを確かめてから承認する
        multivalued: true
        required: true

  TableApproval:
    tree_root: true
    description: >-
      表ごとの一括承認（仕様 9.3）。表の提案を一覧で見せ、まとめて承認する（種類を選ぶ問いは除く）。
      プロセス境界（UI → HTTP API）で受け渡す形
    attributes:
      table:
        description: 表の安定 ID
        required: true
      locations:
        description: 見せた問いの場所。今もその表の、種類を選ばなくてよい問いのままであることを確かめてから承認する
        multivalued: true
        required: true

  DomainIndex:
    tree_root: true
    description: >-
      ドメインビューワのドメインの一覧（仕様 7.6：承認済みの OM から作る）。domain / event の承認済みの表がドメインになる。
      relation の表はリンクとしてたどるだけで、ドメインにしない。出さなかった表は理由とともに hidden に持つ（黙って消さない）。
      プロセス境界（HTTP API → UI）で受け渡す形
    attributes:
      ontology:
        required: true
      entity_groups:
        description: OM のすべてのエンティティグループ（名前の順。UI はこの並びでエンティティグループの色を決める。グラフと同じ並び）
        multivalued: true
        required: true
      domains:
        range: DomainSummary
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      hidden:
        range: HiddenTable
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      readable:
        description: 行を読めるか（ソースへの接続がある）
        range: boolean
        required: true

  DomainSummary:
    attributes:
      table:
        description: 表の安定 ID
        required: true
      name:
        required: true
      entity_group:
        required: true
      kind:
        range: TableKind
        required: true
      grain:
      label_columns:
        description: >-
          見出しに使う列（推定：name という列、無ければ名前が name で終わる文字の列を3つまで）。
          空なら label_from の見出し、それも無ければキーが見出し
        multivalued: true
        required: true
      label_from:
        description: >-
          見出しの列が無いとき、見出しを借りる is-a の上位のドメイン（表の安定 ID。主キーを共有するので同じキーの行の見出し）
      key_columns:
        description: 主キーの列
        multivalued: true
        required: true
      natural_keys:
        description: 代替キー（自然キー）の列（どれかの代替キーに含まれる列）
        multivalued: true
        required: true
      searchable:
        description: 検索に使う列（文字の部分一致）
        multivalued: true
        required: true

  HiddenTable:
    attributes:
      table:
        required: true
      name:
        required: true
      reason:
        required: true

  DomainRows:
    tree_root: true
    description: >-
      ドメインの集合のビュー（表のイメージ）。within があれば、そのインスタンスにつながる行だけの部分集合（八百屋 X の野菜）。
      集合の見せ方と集計（GroupProfile。インスタンスの近隣の集まりと同じ規則・同じ形）は集合全体について、rows は検索（query）で
      絞った先頭・新しいものから。プロセス境界（HTTP API → UI）で受け渡す形
    mixins:
      - GroupProfile
    attributes:
      table:
        required: true
      name:
        required: true
      within:
        range: Within
        inlined: true
      links:
        description: >-
          n:m で絞ったとき（within.via_relation がある）、親とのつながり（relation の行）の集計。インスタンスの n:m の
          集まりの links と同じ
        range: LinkGroup
        inlined: true
      query:
      columns:
        description: 一覧に出す列（技術列を除く。cells の列はこの中から）
        multivalued: true
        required: true
      rows:
        range: InstanceSummary
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      limit:
        range: integer
        required: true
      truncated:
        range: boolean
        required: true

  Within:
    description: >-
      集合を絞るインスタンス（親）と、その親への関係。1:n なら子の表から親への関係（relation）。n:m なら relation の表を挟む：
      relation は relation の表から集合の表への関係、via_relation は relation の表から親への関係（RelatedGroup と同じ意味）
    attributes:
      table:
        description: 親のドメイン（表の安定 ID）
        required: true
      key:
        multivalued: true
        required: true
      relation:
        description: 1:n なら子の表から親への関係、n:m なら relation の表から集合の表への関係の安定 ID
        required: true
      via_relation:
        description: n:m のとき、relation の表から親への関係の安定 ID
      label:
        description: 親のインスタンスの見出し
        required: true
      name:
        description: 親の表の名前
        required: true

  InstanceSummary:
    description: インスタンス（行）の見出し。key でたどれる
    attributes:
      table:
        required: true
      key:
        description: 主キーの値（文字列の表現、主キーの列の順）
        multivalued: true
        required: true
      label:
        description: 見出し（出どころは label_source）
        required: true
      label_source:
        range: LabelSource
        required: true
      cells:
        range: Cell
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      link_cells:
        description: >-
          via の集まりの行で、この行と結んだ relation の表の行の値（参照の列、技術列、代理キーを除く。期間や数量など、
          つながりの属性）。代理キーは、1列で参照でない relation の表の主キー（行の番号でしかない。構造からの推定）。
          via の集まりは relation の表の行ごとに1つ（同じ先が別の期間で2回出ることがある）
        range: Cell
        multivalued: true
        inlined: true
        inlined_as_list: true

  Cell:
    attributes:
      column:
        required: true
      value:
        description: 表示の文字列。NULL は無し
      semantic_type:

  Instance:
    tree_root: true
    description: >-
      インスタンスのビュー（行のイメージ）。自分の値、参照先へのリンク（n:1）、近隣のインスタンスの集まり
      （参照してくる行 1:n、relation の表を挟んだ先 n:m）。プロセス境界（HTTP API → UI）で受け渡す形
    attributes:
      table:
        required: true
      name:
        required: true
      key:
        multivalued: true
        required: true
      label:
        required: true
      fields:
        range: Cell
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      links:
        range: InstanceLink
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      related:
        range: RelatedGroup
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      omitted:
        description: たどらなかった関係と理由（参照先・参照元がドメインでない、列の等値で結べない、など）。黙って省かない
        range: OmittedRelation
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true

  OmittedRelation:
    attributes:
      relation:
        description: 関係の安定 ID
        required: true
      table:
        description: その関係を持つ表の名前
        required: true
      reason:
        required: true

  InstanceLink:
    description: 参照先（n:1）のインスタンスへのリンク。target は state が found のときだけ
    attributes:
      relation:
        description: 関係の安定 ID
        required: true
      relation_type:
        range: RelationType
        required: true
      role:
      columns:
        description: 参照に使う自分の列
        multivalued: true
        required: true
      target_table:
        required: true
      target_name:
        required: true
      state:
        range: LinkState
        required: true
      target:
        range: InstanceSummary
        inlined: true

  GroupProfile:
    mixin: true
    description: >-
      集まり・集合の見せ方と集計（browse.group_view と _profile）。インスタンスの近隣の集まり（RelatedGroup）と、
      ドメインの集合（DomainRows）が同じ形で持つ（部分集合も全体も同じ規則で見せる）
    attributes:
      view:
        range: GroupView
        required: true
      count:
        description: 集まり・集合の行の数（集合なら検索で絞る前。LinkGroup なら relation の表の行の数）。rows は先頭・新しいものからの一部
        range: integer
        required: true
        minimum_value: 0
      time_column:
        description: 出来事の時刻の列（role event_time。LinkGroup なら relation の表の列）。rows はこの列の新しい順
      period_from:
        description: 期間の始まりの列（role valid_from。LinkGroup なら relation の表の列）
      period_to:
        description: 期間の終わりの列（role valid_to）
      measures:
        description: 尺度の集計（集まり全体）
        range: MeasureValue
        multivalued: true
        inlined: true
        inlined_as_list: true
      skipped_measures:
        description: 集計しなかった尺度と理由（単位が混ざる、時間の軸で合計できない、など）
        range: SkippedMeasure
        multivalued: true
        inlined: true
        inlined_as_list: true
      breakdown_column:
        description: 内訳の列（enum の意味型の列）
      breakdown:
        range: BreakdownValue
        multivalued: true
        inlined: true
        inlined_as_list: true
      breakdown_truncated:
        range: boolean
      series_unit:
        range: BucketUnit
      series_measures:
        description: series の各点の values に入る尺度の列（合計）
        multivalued: true
      series:
        description: 区切りの古い順。行の無い区切りも count 0 で入る（時間軸を詰めない）
        range: SeriesPoint
        multivalued: true
        inlined: true
        inlined_as_list: true
      latest:
        description: >-
          最新の日（time_column の値の日付で最も新しい日）のまとめ。データが今日まで届いていれば今日（is_today）。
          届いていなければ最新の日を基準日として明示する
        range: LatestDay
        inlined: true

  RelatedGroup:
    description: >-
      インスタンスの近隣の集まり。見せ方・集計・行は集まりの表（table）の行について：1:n なら参照してくる子の行、n:m なら
      relation の表の行でつながる先の行（重複しない。八百屋 X の野菜）。n:m のつながり自体（期間・数量などの属性）は links
    mixins:
      - GroupProfile
    attributes:
      kind:
        range: RelatedKind
        required: true
      relation:
        description: たどった関係の安定 ID（via なら、relation の表から先への関係）
        required: true
      relation_type:
        range: RelationType
        required: true
      table:
        description: 集まりの行のドメイン
        required: true
      name:
        required: true
      columns:
        description: >-
          参照に使う列。children なら集まりの表の列（このインスタンスを指す列）、via なら relation の表の列（先を指す列）
        multivalued: true
        required: true
      via_table:
        description: 挟んだ relation の表（via のとき）
      via_relation:
        description: >-
          relation の表から、このインスタンスへの関係の安定 ID（via のとき）。relation の表が同じ表へ2本の参照を持つと
          （部品表の組立品と部品）、どちら側から見た集まりかを区別する
      via_columns:
        description: relation の表の、このインスタンスを指す列（via のとき）
        multivalued: true
      via_name:
      rows:
        range: InstanceSummary
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      truncated:
        range: boolean
        required: true
      links:
        description: n:m（via）のとき、つながり（relation の行）の集計
        range: LinkGroup
        inlined: true

  LinkGroup:
    description: >-
      n:m のつながり（relation の表の、親を指す行）の集まり。見せ方と集計は relation の行について（期間の帯、数量の合計など）。
      rows は relation の行ごとの先のインスタンスで、その行の属性を link_cells に持つ（同じ先が2回出ることがある）
    mixins:
      - GroupProfile
    attributes:
      table:
        description: relation の表の安定 ID
        required: true
      name:
        required: true
      rows:
        range: InstanceSummary
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      truncated:
        range: boolean
        required: true
      missing:
        description: relation の行が指す先の行が無かった数（壊れた参照）
        range: integer
        required: true
        minimum_value: 0
      unlinked:
        description: >-
          relation の行のうち、先を指す列が NULL の数（先が無いつながり。壊れた参照ではない）。打ち切っていなければ
          rows の数 + missing + unlinked = 読んだ relation の行の数
        range: integer
        required: true
        minimum_value: 0

  MeasureValue:
    attributes:
      column:
        required: true
      op:
        range: MeasureOp
        required: true
      value:
        description: 表示の文字列。対象の値が無ければ無し
      unit_text:
        description: 単位（固定の単位、または単位の列の値がすべて同じならその値）

  SkippedMeasure:
    attributes:
      column:
        required: true
      reason:
        required: true

  BreakdownValue:
    attributes:
      value:
        description: 表示の文字列（enum はラベルつき）。NULL は無し
      count:
        range: integer
        required: true

  SeriesPoint:
    attributes:
      start:
        description: 区切りの始まりの日付（ISO 8601）
        range: date
        required: true
      count:
        range: integer
        required: true
      sums:
        description: series_measures の順の合計。区切りに値が無ければ value 無し（0 とは区別する）
        range: SeriesSum
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true

  SeriesSum:
    attributes:
      value:
        range: float

  LatestDay:
    attributes:
      day:
        range: date
        required: true
      is_today:
        range: boolean
        required: true
      count:
        range: integer
        required: true
      measures:
        description: 加法の尺度の、最新の日の合計
        range: MeasureValue
        multivalued: true
        inlined: true
        inlined_as_list: true
      snapshot_at:
        description: 半加法の尺度を合計した時点（time_column の最大の値。表示の文字列）
      snapshot:
        description: 半加法の尺度（残高・在庫など）の、最新の時点（snapshot_at）の行だけの合計
        range: MeasureValue
        multivalued: true
        inlined: true
        inlined_as_list: true

  PointSet:
    tree_root: true
    description: >-
      表の geo.point の列の値を点にしたもの（地図のため）。プロセス境界（HTTP API → UI）で受け渡す形。
      変換できなかった行は黙って捨てず failed に、NULL は数を nulls に持つ。
      rows_read = points の数 + nulls + failed の数。truncated なら、表には limit を超える行がある
    attributes:
      table:
        description: 表の安定 ID
        required: true
      column:
        required: true
      points:
        range: GeoPointRow
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      nulls:
        range: integer
        required: true
        minimum_value: 0
      failed:
        range: PointFailure
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      rows_read:
        description: 読んだ行の数（limit 以下）
        range: integer
        required: true
        minimum_value: 0
      limit:
        description: 読む行の上限
        range: integer
        required: true
        minimum_value: 1
      truncated:
        description: 上限で打ち切った（表にはまだ行がある）
        range: boolean
        required: true

  GeoPointRow:
    attributes:
      key:
        description: >-
          行の主キーの値（主キーの列の順）。各値をソースの値の文字列表現（Python の str）にしたもの。
          主キーは NULL を持たない（仕様 4.2）
        multivalued: true
        required: true
      lat:
        range: float
        required: true
        minimum_value: -90
        maximum_value: 90
      lon:
        range: float
        required: true
        minimum_value: -180
        maximum_value: 180

  PointFailure:
    attributes:
      key:
        multivalued: true
        required: true
      reason:
        required: true
